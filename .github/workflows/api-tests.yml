name: API Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Run API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Generate Allure report
        if: ${{ always() && hashFiles('target/allure-results/*-result.json') != '' }}
        run: mvn --batch-mode --no-transfer-progress allure:report

      - name: Upload test results and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven/
          if-no-files-found: warn
          retention-days: 14